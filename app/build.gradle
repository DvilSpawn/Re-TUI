apply plugin: 'com.android.application'

dependencies {
    implementation project(':retui-datetime-picker')
    implementation project(':retui-contract')
}

android {
    namespace = "ohi.andre.consolelauncher"
    compileSdk = 36
    ndkVersion = '27.1.12297006'
    sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('qalculate/jniLibs').get().asFile
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('qalculate/notices').get().asFile
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('termux-helper-assets').get().asFile

    def keystorePropertiesFile = rootProject.file("local.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }
    def releaseStoreFile = keystoreProperties["storeFile"]
    def releaseStorePassword = keystoreProperties["storePassword"]
    def releaseKeyAlias = keystoreProperties["keyAlias"]
    def releaseKeyPassword = keystoreProperties["keyPassword"]
    def hasReleaseSigning = releaseStoreFile
            && releaseStorePassword
            && releaseKeyAlias
            && releaseKeyPassword
            && rootProject.file(releaseStoreFile).exists()

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId = "com.dvil.tui_renewed"
        minSdk = 23
        targetSdk = 36
        versionCode = 500
        versionName = "3"

        testInstrumentationRunner = providers.gradleProperty('ircReleaseSmokeRunner').map { it.toBoolean() }
                .getOrElse(false) ? "ohi.andre.consolelauncher.irc.IrcReleaseSmokeInstrumentation"
                : "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders.applicationLabel = '@string/app_name'
    }

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    buildTypes {
        debug {
            pseudoLocalesEnabled = true
            if (providers.gradleProperty('fetchDebug').map { it.toBoolean() }.getOrElse(false)) {
                def paletteDebug = providers.gradleProperty('paletteDebug').map { it.toBoolean() }.getOrElse(false)
                applicationIdSuffix = paletteDebug ? '.palettedebug' : '.fetchdebug'
                manifestPlaceholders.applicationLabel = paletteDebug ? 'Re:TUI Palette Test' : 'Re:T-UI Debug'
            }
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }

    productFlavors {
        flavorDimensions = ["default"]
        fdroid {
            dimension = "default"
        }
        playstore {
            dimension = "default"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }

    lint {
        checkReleaseBuilds = false
    }
}

androidComponents.beforeVariants(androidComponents.selector().all()) { variant ->
    if (providers.gradleProperty('fetchDebug').map { it.toBoolean() }.getOrElse(false)) {
        variant.enable = variant.buildType == 'debug' && variant.productFlavors.any { it.second == 'playstore' }
    }
}

def buildNativeQalculate = tasks.register('buildNativeQalculate', Exec) {
    group = 'build'
    description = 'Builds the offline Qalculate JNI engine from pinned upstream sources for all four ABIs.'
    inputs.files(rootProject.fileTree('native/qalculate') { exclude '**/__pycache__/**' })
    outputs.dir(layout.buildDirectory.dir('qalculate/jniLibs'))
    commandLine 'python3', rootProject.file('native/qalculate/build.py'),
            '--ndk', new File(androidComponents.sdkComponents.sdkDirectory.get().asFile, "ndk/${android.ndkVersion}")
}
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('JniLibFolders') }.configureEach {
    dependsOn(buildNativeQalculate)
}
def qalculateNotices = tasks.register('qalculateNotices', Sync) {
    from(rootProject.projectDir) {
        include 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'LICENSES/**'
        include 'native/qalculate/README.md', 'native/qalculate/sources.json'
        include 'third_party/*.json', 'third_party/*.md', 'third_party/*.patch'
    }
    into(layout.buildDirectory.dir('qalculate/notices/licenses'))
}
def termuxHelperAssets = tasks.register('termuxHelperAssets', Sync) {
    from(rootProject.file('termux/retui/bin/retui'))
    from(rootProject.file('termux/retui/update.sh'))
    into(layout.buildDirectory.dir('termux-helper-assets/termux-helper'))
}

def validateRuntimeNotices = tasks.register('validateRuntimeNotices') {
    group = 'verification'
    description = 'Requires reviewed notice records for the resolved release runtime libraries.'
    inputs.file(rootProject.file('third_party/runtime-libraries.json'))
    inputs.file(rootProject.file('third_party/sources.json'))
    inputs.dir(rootProject.file('LICENSES'))
    doLast {
        def entries = new groovy.json.JsonSlurper().parse(rootProject.file('third_party/runtime-libraries.json'))
        def recorded = entries.collect { it.coordinate }.toSet()
        if (recorded.size() != entries.size()) throw new GradleException('Duplicate runtime notice coordinates')
        ['playstoreReleaseRuntimeClasspath', 'fdroidReleaseRuntimeClasspath'].each { name ->
            def resolved = configurations.getByName(name).incoming.resolutionResult.allComponents
                    .findAll { it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                    .collect { it.id.displayName }.toSet()
            if (resolved != recorded) {
                throw new GradleException("Review third_party/runtime-libraries.json for ${name}: missing ${resolved - recorded}; stale ${recorded - resolved}")
            }
        }
        entries.each { entry ->
            if (!entry.license_files) throw new GradleException("No notice texts for ${entry.coordinate}")
            entry.license_files.each { name ->
                if (!rootProject.file("LICENSES/${name}").isFile()) {
                    throw new GradleException("Missing notice ${name} for ${entry.coordinate}")
                }
            }
        }
        def sourceInputs = new groovy.json.JsonSlurper().parse(rootProject.file('third_party/sources.json'))
        if (sourceInputs.collect { it.coordinate }.toSet() != entries.findAll {
            it.license_files.contains('Tasker-GPL-3.0.txt')
        }.collect { it.coordinate }.toSet()) {
            throw new GradleException('Tasker runtime version and corresponding-source pins must match')
        }
        sourceInputs.each { source ->
            if (!recorded.contains(source.coordinate)) throw new GradleException("Stale source input: ${source.coordinate}")
        }
        println("Verified notice records for ${recorded.size()} external runtime components")
    }
}
tasks.named('preBuild').configure { dependsOn(validateRuntimeNotices) }
tasks.matching {
    (it.name.startsWith('merge') && it.name.endsWith('Assets')) ||
            it.name.toLowerCase(Locale.ROOT).contains('lint')
}.configureEach {
    dependsOn(qalculateNotices, termuxHelperAssets)
}

def guardedSourceSetNames = ["main", "fdroid", "playstore"]
def allowedSourceSetDirs = [
        "aidl",
        "assets",
        "java",
        "jni",
        "jniLibs",
        "kotlin",
        "res",
        "rs"
] as Set
def blockedPathSegments = [
        "build",
        "captures",
        "perf-results",
        "screenshots",
        "testbook",
        "testbooks",
        "traces"
] as Set
def blockedFileNames = [
        ".DS_Store",
        "Thumbs.db",
        "desktop.ini",
        "google-services.json",
        "local.properties",
        "signing.properties",
        "keystore.properties"
] as Set
def blockedExtensions = [
        ".apk",
        ".csv",
        ".dm",
        ".gz",
        ".hprof",
        ".idsig",
        ".jks",
        ".keystore",
        ".log",
        ".markdown",
        ".md",
        ".p12",
        ".swp",
        ".tar",
        ".trace",
        ".tsv",
        ".tmp",
        ".txt",
        ".zip"
] as Set
def allowedResourceExtensions = [
        ".9.png",
        ".avif",
        ".gif",
        ".jpeg",
        ".jpg",
        ".otf",
        ".png",
        ".ttf",
        ".wav",
        ".webp",
        ".xml"
] as Set

def projectRelativePath = { File sourceFile ->
    projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, "/")
}

def fileExtension = { File sourceFile ->
    def lowerName = sourceFile.name.toLowerCase(Locale.ROOT)
    if (lowerName.endsWith(".9.png")) {
        return ".9.png"
    }
    def lastDot = lowerName.lastIndexOf(".")
    return lastDot >= 0 ? lowerName.substring(lastDot) : ""
}

def addCommonSourceInputErrors = { File sourceFile, List<String> errors ->
    def relativePath = projectRelativePath(sourceFile)
    def lowerName = sourceFile.name.toLowerCase(Locale.ROOT)
    def segments = relativePath.split("/") as List

    if (blockedFileNames.contains(sourceFile.name) || blockedFileNames.contains(lowerName)) {
        errors.add("${relativePath} uses a blocked local/generated file name")
    }

    if (segments.any { blockedPathSegments.contains(it.toLowerCase(Locale.ROOT)) }) {
        errors.add("${relativePath} is under a blocked local/generated folder")
    }

    def extension = fileExtension(sourceFile)
    if (blockedExtensions.contains(extension) && relativePath != "src/main/assets/localization/english-template.zip") {
        errors.add("${relativePath} uses blocked extension ${extension}")
    }
}

def isAllowedAsset = { File assetsDir, File sourceFile ->
    def relativeAssetPath = assetsDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, "/")
    return relativeAssetPath == "JetBrainsMonoNerdFont-Regular.ttf"
            || relativeAssetPath in ["localization/catalog.json", "localization/english-template.zip"]
            || relativeAssetPath in ["module-library/index.json", "module-library/todo.lua",
                "module-library/habits.lua", "module-library/focus.lua",
                "module-library/bookmarks.lua", "module-library/year_progress.lua"]
            || (relativeAssetPath.startsWith("first_run_terminal_green/")
            && !relativeAssetPath.substring("first_run_terminal_green/".length()).contains("/")
            && relativeAssetPath.endsWith(".xml"))
            || (relativeAssetPath.startsWith("frame_packs/sprout_lands/")
            && !relativeAssetPath.substring("frame_packs/sprout_lands/".length()).contains("/")
            && (relativeAssetPath.endsWith(".png") || relativeAssetPath.endsWith(".xml")))
}

def validateSourceTree = { File sourceDir, String kind, List<String> errors ->
    if (!sourceDir.exists()) {
        return
    }

    sourceDir.eachFileRecurse { File sourceFile ->
        if (!sourceFile.isFile()) {
            return
        }

        addCommonSourceInputErrors(sourceFile, errors)

        def relativePath = projectRelativePath(sourceFile)
        def extension = fileExtension(sourceFile)
        if (kind == "java" && extension != ".java" && extension != ".kt") {
            errors.add("${relativePath} is not a Kotlin or Java source file")
        } else if (kind == "res" && !allowedResourceExtensions.contains(extension)) {
            errors.add("${relativePath} is not an allowed Android resource file type")
        } else if (kind == "assets" && !isAllowedAsset(sourceDir, sourceFile)) {
            errors.add("${relativePath} is not an explicit allowed asset")
        }
    }
}

tasks.register("validateSourceInputs") {
    group = "verification"
    description = "Fails Android builds when source-set packaging inputs contain local clutter or unexpected artifacts."

    doLast {
        def errors = []

        guardedSourceSetNames.each { sourceSetName ->
            def sourceRoot = file("src/${sourceSetName}")
            if (!sourceRoot.exists()) {
                return
            }

            sourceRoot.eachFile { File child ->
                def relativePath = projectRelativePath(child)
                if (child.isFile()) {
                    if (child.name != "AndroidManifest.xml") {
                        errors.add("${relativePath} is an unexpected top-level source-set file")
                    }
                    addCommonSourceInputErrors(child, errors)
                } else if (child.isDirectory() && !allowedSourceSetDirs.contains(child.name)) {
                    errors.add("${relativePath} is an unexpected top-level source-set directory")
                }
            }

            validateSourceTree(file("src/${sourceSetName}/java"), "java", errors)
            validateSourceTree(file("src/${sourceSetName}/kotlin"), "java", errors)
            validateSourceTree(file("src/${sourceSetName}/res"), "res", errors)
            validateSourceTree(file("src/${sourceSetName}/assets"), "assets", errors)
        }

        if (!errors.isEmpty()) {
            throw new GradleException(
                    "Unexpected app source input files were found. Keep test notes and runtime captures in local ignored output folders.\n - "
                            + errors.unique().sort().join("\n - ")
            )
        }
    }
}

tasks.matching { it.name == "preBuild" || (it.name.startsWith("pre") && it.name.endsWith("Build")) }.configureEach {
    dependsOn(tasks.named("validateSourceInputs"))
}

tasks.register("cleanLocalArtifacts", Delete) {
    group = "cleanup"
    description = "Removes ignored local build/cache clutter while leaving signing and local config files untouched."

    delete rootProject.file("build")
    delete project.file("build")
    delete rootProject.file("perf-results")
    delete rootProject.file(".wrangler")
    delete fileTree(rootProject.projectDir) {
        include "**/.DS_Store"
        exclude ".git/**"
    }

    doFirst {
        def dsStoreFiles = []
        rootProject.projectDir.eachFileRecurse { File localFile ->
            if (localFile.name == ".DS_Store"
                    && !localFile.toPath().startsWith(rootProject.file(".git").toPath())) {
                dsStoreFiles.add(localFile)
            }
        }
        delete dsStoreFiles
    }
}

dependencies {
