limit_req_zone $binary_remote_addr zone=retui_signup:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=retui_auth:1m rate=20r/m;
# Empty keys are not counted: reads and posts cannot spend each other's quota.
map $request_method $retui_read_key {
    default "";
    GET $binary_remote_addr;
}
map $request_method $retui_post_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $retui_read_key zone=retui_reads:1m rate=240r/m;
limit_req_zone $retui_post_key zone=retui_posts:1m rate=20r/m;
limit_req_zone $retui_post_key zone=retui_report_posts:1m rate=5r/m;
limit_req_zone $retui_post_key zone=retui_presence_posts:1m rate=120r/m;
limit_req_zone $retui_post_key zone=retui_moderation_posts:1m rate=20r/m;
limit_req_zone $retui_post_key zone=retui_deletion_posts:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=retui_streams:1m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=retui_stream_connections:1m;
map $request_uri $retui_operation {
    default other;
    ~^/community/api/realtime(?:\?|$) realtime;
    ~^/community/api/community/presence(?:\?|$) presence;
    ~^/community/api/community/users(?:\?|$) directory;
    ~^/community/api/community/mentions(?:\?|$) mentions;
    ~^/community/api/collections/messages/records(?:/|\?|$) messages;
    ~^/community/api/collections/threads/records(?:/|\?|$) threads;
    ~^/community/api/collections/thread_replies/records(?:/|\?|$) replies;
}
# No IP, account, record ID, URL/query, body, cookie or authorization fields.
log_format retui_community_timing '$time_iso8601 operation=$retui_operation method=$request_method status=$status seconds=$request_time upstream_seconds=$upstream_response_time';

server {
    listen 443 ssl;
    server_name irc.kokodoko.cloud;
    ssl_certificate /etc/letsencrypt/live/irc.kokodoko.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/irc.kokodoko.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8k;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    limit_req_status 429;
    access_log /var/log/nginx/retui-community-timing.log retui_community_timing;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;

    # Positive normalized-path allowlist: dashboard, setup, uploads,
    # superusers, batch, SQL, OAuth and unknown paths never reach PocketBase.
    location = /community/api/realtime {
        if ($request_method !~ ^(GET|POST)$) { return 404; }
        limit_req zone=retui_streams burst=10 nodelay;
        limit_conn retui_stream_connections 10;
        limit_conn_status 429;
        include /etc/nginx/snippets/retui-community-proxy.conf;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
    location ~ ^/community/api/community/(users|mentions)$ {
        if ($request_method != GET) { return 404; }
        limit_req zone=retui_reads burst=60 nodelay;
        include /etc/nginx/snippets/retui-community-proxy.conf;
    }
    location = /community/api/community/presence {
        if ($request_method != POST) { return 404; }
        limit_req zone=retui_presence_posts burst=30 nodelay;
        include /etc/nginx/snippets/retui-community-proxy.conf;
    }
    location ~ ^/community/(account-deletion|rules)$ {
        if ($request_method != GET) { return 404; }
        alias /opt/retui-community/public/$1.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header Referrer-Policy no-referrer always;
    }
    location ~ ^/community/(account-deletion\.js|community\.css)$ {
        if ($request_method != GET) { return 404; }
        alias /opt/retui-community/public/$1;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /community/api/community/moderation {
        if ($request_method != GET) { return 404; }
        limit_req zone=retui_reads burst=60 nodelay;
        include /etc/nginx/snippets/retui-community-proxy.conf;
    }
    location = /community/api/community/policy {
        if ($request_method != POST) { return 404; }
        limit_req zone=retui_auth burst=5 nodelay;
        include /etc/nginx/snippets/retui-community-proxy.conf;
    }
    location = /community/api/community/moderation/action {
        if ($request_method != POST) { return 404; }
        limit_req zone=retui_moderation_posts burst=5 nodelay;
        include /etc/nginx/snippets/retui-community-proxy.conf;
    }
    location = /community/api/community/account-delete {
        if ($request_method != POST) { return 404; }
        limit_req zone=retui_deletion_posts burst=2 nodelay;
        include /etc/nginx/snippets/retui-community-proxy.conf;
    }
    location = /community/api/community/report {
        if ($request_method != POST) { return 404; }
        limit_req zone=retui_report_posts burst=2 nodelay;
        include /etc/nginx/snippets/retui-community-proxy.conf;
    }
    location = /community/api/health {
        if ($request_method != GET) { return 404; }
        limit_req zone=retui_reads burst=60 nodelay;
        include /etc/nginx/snippets/retui-community-proxy.conf;
    }
    location = /community/api/collections/members/records {
        if ($request_method != POST) { return 403; }
        limit_req zone=retui_signup burst=2 nodelay;
        include /etc/nginx/snippets/retui-community-proxy.conf;
    }
    location ~ ^/community/api/collections/members/(auth-with-password|auth-refresh)$ {
        if ($request_method != POST) { return 404; }
        limit_req zone=retui_auth burst=5 nodelay;
        include /etc/nginx/snippets/retui-community-proxy.conf;
    }
    location ~ ^/community/api/collections/(messages|threads|thread_replies)/records$ {
        if ($request_method !~ ^(GET|POST)$) { return 404; }
        limit_req zone=retui_reads burst=60 nodelay;
        limit_req zone=retui_posts burst=5 nodelay;
        include /etc/nginx/snippets/retui-community-proxy.conf;
    }
    location ~ "^/community/api/collections/(messages|threads|thread_replies)/records/[a-z0-9]{15}$" {
        if ($request_method != GET) { return 404; }
        limit_req zone=retui_reads burst=60 nodelay;
        include /etc/nginx/snippets/retui-community-proxy.conf;
    }
    location ~ ^/community/api/collections/(reports|moderator_requests)/records$ {
        if ($request_method !~ ^(GET|POST)$) { return 404; }
        limit_req zone=retui_report_posts burst=2 nodelay;
        limit_req zone=retui_reads burst=60 nodelay;
        include /etc/nginx/snippets/retui-community-proxy.conf;
    }
    location ~ "^/community/api/collections/(reports|moderator_requests)/records/[a-z0-9]{15}$" {
        if ($request_method != GET) { return 404; }
        limit_req zone=retui_reads burst=60 nodelay;
        include /etc/nginx/snippets/retui-community-proxy.conf;
    }
    error_page 403 = @community_forbidden;
    error_page 404 = @community_missing;
    error_page 413 = @community_large;
    error_page 429 = @community_throttled;
    location @community_forbidden { default_type application/json; return 403 '{"status":403,"message":"Forbidden","data":{}}'; }
    location @community_missing { default_type application/json; return 404 '{"status":404,"message":"Not found","data":{}}'; }
    location @community_large { default_type application/json; return 413 '{"status":413,"message":"Request too large","data":{}}'; }
    location @community_throttled {
        default_type application/json;
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"status":429,"message":"Rate limit exceeded","data":{}}';
    }
    location / { return 404; }
}
